<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智翔館 面談予約</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    /* 画面いっぱいにGASアプリを表示 */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <!--
    ↓ src を、GASでデプロイしたWebアプリの exec URL に差し替えてください。
       例: https://script.google.com/macros/s/AKfyc.../exec
       管理画面を埋め込む場合は末尾に ?admin=1 を付けます。
  -->
  <iframe
    id="app-frame"
    src="__GAS_WEBAPP_EXEC_URL__"
    title="智翔館 面談予約"
    allow="clipboard-write"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</body>
</html>
